name: CI/CD — Test, Build, Push & Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE: mbgh09/internship_proj

jobs:

  # ============================================================
  # JOB 1 — Run Tests
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: event_db_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, gd, zip, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env for testing
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run PHPUnit tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: event_db_test
          DB_USERNAME: test_user
          DB_PASSWORD: secret
        run: php artisan test

  # ============================================================
  # JOB 2 — Build & Push Docker image to Docker Hub
  # (only on push to main or develop, not on PRs)
  # ============================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build & Push image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image digest
        run: echo "Image pushed with digest ${{ steps.build-and-push.outputs.digest }}"

  # ============================================================
  # JOB 3 — Deploy to VPS via SSH
  # Runs only on push to main, after a successful image push.
  #
  # ⚠️  NO VPS YET?
  #   Leave the secrets below unset in GitHub → the "Check VPS
  #   secrets" step will detect this and skip the deploy cleanly
  #   (exit 0). CI stays green. Add the secrets when your server
  #   is ready and every future push will auto-deploy.
  #
  # Required GitHub Secrets (Settings → Secrets → Actions):
  #   VPS_HOST       — IP address or hostname of your VPS
  #   VPS_USER       — SSH username  (e.g. ubuntu, deploy)
  #   VPS_SSH_KEY    — Private SSH key (full content of ~/.ssh/id_rsa)
  #   VPS_PORT       — SSH port (default 22, optional)
  #   VPS_APP_DIR    — Absolute project path on the VPS
  #                    (e.g. /home/ubuntu/event-planner)
  # ============================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # ----------------------------------------------------------
      # Guard — skip gracefully when VPS is not yet configured.
      # Checks for the presence of VPS_HOST; if missing or empty,
      # prints an informational message and exits with 0 so the
      # overall workflow stays green.
      # ----------------------------------------------------------
      - name: Check VPS secrets are configured
        id: vps-check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "⏭️  VPS_HOST secret is not set — skipping deploy."
            echo "   Add VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_APP_DIR"
            echo "   to GitHub Secrets to activate CD."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ VPS secrets detected — proceeding with deploy."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ----------------------------------------------------------
      # Deploy — SSH into the VPS, pull the new image, restart.
      # Skipped automatically when the guard above sets skip=true.
      # ----------------------------------------------------------
      - name: Deploy via SSH
        if: steps.vps-check.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            # Navigate to the project directory
            cd "${{ secrets.VPS_APP_DIR }}"

            # Authenticate with Docker Hub to pull private/rate-limited images
            echo "${{ secrets.DOCKERHUB_TOKEN }}" \
              | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull the freshly pushed image for the app service only
            docker compose pull app

            # Restart containers with zero-downtime rolling update
            docker compose up -d --remove-orphans

            # Clean up dangling images to reclaim disk space
            docker image prune -f

            echo "✅ Deploy complete — $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
