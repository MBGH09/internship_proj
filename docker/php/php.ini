; PHP production settings for Laravel
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
max_input_time = 60
date.timezone = UTC

; Disable dangerous functions
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php_errors.log
